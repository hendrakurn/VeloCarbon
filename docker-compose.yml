services:
  postgres:
    image: postgres:16-alpine
    container_name: velocarbon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: velocarbon_db
      POSTGRES_USER: velocarbon
      POSTGRES_PASSWORD: velocarbon123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
