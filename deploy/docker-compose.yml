# PostgreSQL lokal untuk VeloCarbon:  docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: velocarbon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: velocarbon
      POSTGRES_USER: velocarbon
      POSTGRES_PASSWORD: velocarbon
    ports:
      - "5432:5432"
    volumes:
      - velocarbon-data:/var/lib/postgresql/data
volumes:
  velocarbon-data:
